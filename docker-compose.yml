
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_USER: ${POSTGRES_USER:-autogestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env.docker}
    volumes:
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autogestor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend}
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en .env.docker}
    volumes:
      - vehicle_uploads:/app/static/uploads/vehiculos
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_18:
  vehicle_uploads:
